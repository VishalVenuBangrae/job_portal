<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Nauti Crew Agency</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
  <style>
    #forgotError:not(:empty), #forgotSuccess:not(:empty) { margin-top: 12px; font-size: 0.85rem; }
    #forgotError:not(:empty) { color: var(--danger); }
    #forgotSuccess:not(:empty) { color: var(--success); }
  </style>
</head>
<body class="nca-auth">
  <div class="nca-auth-card">
    <div class="nca-auth-logo">
      <img src="/images/nca-logo.png" alt="Nauti Crew Agency">
      <div class="eyebrow">Nauti Crew Agency</div>
    </div>
    <h1 class="nca-auth-title">Forgot Password</h1>
    <p class="nca-auth-subtitle">Enter your email and we'll send you a reset code</p>

    <form id="forgotForm">
      <div class="form-group">
        <input type="email" class="form-input" name="email" placeholder="Email address" required>
        <span class="input-icon">@</span>
      </div>
      <button type="submit" class="nca-auth-btn">Send Reset Code</button>
      <div id="forgotError"></div>
      <div id="forgotSuccess"></div>
    </form>

    <div class="nca-auth-links">
      <p>Remembered? <a href="/login.html">Login</a></p>
    </div>
  </div>
  <script src="/forgot-password.js"></script>
</body>
</html>
