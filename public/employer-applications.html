<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applications - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="/employer.html" class="logo">
        <span class="logo-icon">🔗</span>
        <span>Yacht Crew Portal</span>
      </a>
      <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="/employer.html" class="nav-link">Dashboard</a>
        <a href="/post-job.html" class="nav-link">Post Job</a>
        <a href="/employer-applications.html" class="nav-link active">Applications</a>
        <a href="/change-password.html" class="nav-link">Settings</a>
        <a href="/login.html" class="nav-link" onclick="logout()">Logout</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="totalApplications">0</div>
        <div class="stat-label">Total Applications</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="pendingApplications">0</div>
        <div class="stat-label">Pending Review</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="acceptedApplications">0</div>
        <div class="stat-label">Accepted</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="rejectedApplications">0</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>

    <div class="filter-section">
      <h3>🔍 Filter Applications</h3>
      <div class="filter-row">
        <select id="statusFilter" class="filter-select" onchange="filterApplications()">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="reviewed">Reviewed</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
        <select id="categoryFilter" class="filter-select" onchange="filterApplications()">
          <option value="">All Categories</option>
          <option value="Daywork/Freelance">Daywork/Freelance</option>
          <option value="Deliveries">Deliveries</option>
        </select>
        <select id="positionFilter" class="filter-select" onchange="filterApplications()">
          <option value="">All Positions</option>
          <option value="Captain">Captain</option>
          <option value="Engineer">Engineer</option>
          <option value="Bosun">Bosun</option>
          <option value="Mate">Mate</option>
          <option value="Deckhand">Deckhand</option>
          <option value="Chef/crew cook">Chef/crew cook</option>
          <option value="Chief Stewardess">Chief Stewardess</option>
          <option value="2nd Stewardess">2nd Stewardess</option>
          <option value="Stewardess">Stewardess</option>
        </select>
        <input type="text" id="searchFilter" class="filter-input" placeholder="Search by name or email..." onkeyup="filterApplications()">
      </div>
      
      <div class="filter-row">
        <div class="location-selector">
          <select id="countryFilter" class="filter-select" onchange="loadFilterCities()">
            <option value="">All Countries</option>
          </select>
          <select id="cityFilter" class="filter-select" onchange="loadFilterPorts()">
            <option value="">All Cities</option>
          </select>
          <select id="portFilter" class="filter-select" onchange="handlePortSelection()">
            <option value="">All Ports</option>
          </select>
          <input type="text" id="customPortInput" class="form-input" placeholder="Type custom port name..." style="display: none;" onkeyup="handleCustomPortInput()">
        </div>
        <button class="btn btn-outline" onclick="clearFilters()">Clear Filters</button>
      </div>
    </div>

    <div id="applicationsList">
      <div class="loading">
        <div class="spinner"></div>
        Loading applications...
      </div>
    </div>
  </div>

  <script>
    let allApplications = [];

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userType');
      window.location.href = '/login.html';
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    // Helper function to format location display
    function formatLocation(location) {
      if (!location) return 'Location not specified';
      
      // If location is a string (old format), return as is
      if (typeof location === 'string') {
        return location;
      }
      
      // If location is an object (new format), format it properly
      if (typeof location === 'object') {
        if (location.displayName) {
          return location.displayName;
        }
        
        let locationParts = [];
        if (location.city) locationParts.push(location.city);
        if (location.port) locationParts.push(location.port);
        if (location.country) locationParts.push(location.country);
        
        return locationParts.length > 0 ? locationParts.join(', ') : 'Location not specified';
      }
      
      return 'Location not specified';
    }

    async function loadAllApplications() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch('/api/v1/jobs/posted', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const jobs = await res.json();
        
        console.log('Loaded jobs:', jobs);
        
        if (jobs.length === 0) {
          document.getElementById('applicationsList').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <h3>No jobs posted yet</h3>
              <p>Post some jobs to start receiving applications!</p>
            </div>
          `;
          return;
        }

        allApplications = [];
        
        // Collect all applications from all jobs with detailed applicant info
        for (const job of jobs) {
          if (job.applications && job.applications.length > 0) {
            // Fetch detailed applications for this job
            try {
              const appRes = await fetch(`/api/v1/jobs/${job._id}/applications`, {
                headers: { 'Authorization': 'Bearer ' + token }
              });
              const detailedApplications = await appRes.json();
              
                             detailedApplications.forEach(app => {
                 app.jobTitle = job.title;
                 app.jobCompany = job.company;
                 app.jobCategory = job.jobCategory;
                 app.jobPosition = job.position;
                 app.jobLocation = job.location;
                 app.jobType = job.jobType;
                 app.jobSalary = job.salary;
                 console.log('Application with ID:', app._id, 'Resume:', app.resume);
                 allApplications.push(app);
               });
            } catch (error) {
              console.error(`Error fetching applications for job ${job._id}:`, error);
              // Fallback to basic application data
              job.applications.forEach(app => {
                app.jobTitle = job.title;
                app.jobCompany = job.company;
                app.jobCategory = job.jobCategory;
                app.jobPosition = job.position;
                app.jobLocation = job.location;
                app.jobType = job.jobType;
                app.jobSalary = job.salary;
                allApplications.push(app);
              });
            }
          }
        }

        if (allApplications.length === 0) {
          document.getElementById('applicationsList').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <h3>No applications received yet</h3>
              <p>Applications will appear here once jobseekers start applying to your jobs.</p>
            </div>
          `;
          updateStats();
          return;
        }

        // Sort applications by newest first
        allApplications.sort((a, b) => new Date(b.appliedAt) - new Date(a.appliedAt));
        
        displayApplications(allApplications);
        updateStats();
      } catch (error) {
        document.getElementById('applicationsList').innerHTML = `
          <div class="message message-error">
            Error loading applications. Please try again later.
          </div>
        `;
      }
    }

    function displayApplications(applications) {
      const applicationsDiv = document.getElementById('applicationsList');
      
      if (applications.length === 0) {
        applicationsDiv.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <h3>No applications match your filters</h3>
            <p>Try adjusting your search criteria.</p>
          </div>
        `;
        return;
      }

      applicationsDiv.innerHTML = applications.map(app => `
        <div class="application-card">
          <div class="application-header">
            <div>
              <div class="applicant-name">${app.applicantName || app.applicant?.name || app.email?.split('@')[0] || 'Unknown Applicant'}</div>
              <div class="job-company">${app.jobTitle} at ${app.jobCompany}</div>
              <div class="job-meta">
                <span class="job-tag job-category">${app.jobCategory}</span>
                <span class="job-tag job-position">${app.jobPosition}</span>
                <span class="job-tag job-type">${app.jobType}</span>
                <span class="job-tag job-location">${formatLocation(app.jobLocation)}</span>
                <span class="job-tag job-salary">${app.jobSalary}</span>
              </div>
              <div class="job-date">Applied: ${formatDate(app.appliedAt)}</div>
            </div>
            <div>
              <div style="margin-bottom: 8px;">
                <span class="status-badge status-${app.status}">${app.status}</span>
              </div>
              <div class="status-actions">
                <button class="btn btn-sm ${app.status === 'pending' ? 'btn-primary' : 'btn-outline'}" 
                        onclick="updateApplicationStatus('${app._id}', 'pending')" 
                        ${app.status === 'pending' ? 'disabled' : ''}>
                  ⏳ Pending
                </button>
                <button class="btn btn-sm ${app.status === 'reviewed' ? 'btn-primary' : 'btn-outline'}" 
                        onclick="updateApplicationStatus('${app._id}', 'reviewed')" 
                        ${app.status === 'reviewed' ? 'disabled' : ''}>
                  👁️ Reviewed
                </button>
                <button class="btn btn-sm ${app.status === 'accepted' ? 'btn-success' : 'btn-outline'}" 
                        onclick="updateApplicationStatus('${app._id}', 'accepted')" 
                        ${app.status === 'accepted' ? 'disabled' : ''}>
                  ✅ Accept
                </button>
                                 <button class="btn btn-sm ${app.status === 'rejected' ? 'btn-danger' : 'btn-outline'}" 
                         onclick="updateApplicationStatus('${app._id}', 'rejected')" 
                         ${app.status === 'rejected' ? 'disabled' : ''}>
                   ❌ Reject
                 </button>
                 ${app.status === 'rejected' ? `
                   <button class="btn btn-sm btn-danger" 
                           onclick="deleteApplication('${app._id}')" 
                           style="margin-top: 4px;">
                     🗑️ Delete
                   </button>
                 ` : ''}
               </div>
             </div>
          </div>
          
          <div class="contact-info">
            <h4>📞 Contact Information</h4>
            <p><strong>Email:</strong> <a href="mailto:${app.email || app.applicant?.email || ''}" class="contact-link">${app.email || app.applicant?.email || 'Not provided'}</a></p>
            <p><strong>Phone:</strong> <a href="tel:${app.phone || app.applicant?.phone || ''}" class="contact-link">${app.phone || app.applicant?.phone || 'Not provided'}</a></p>
          </div>
          
                     ${app.resume ? `
             <div style="margin: 16px 0;">
               <a href="#" class="btn btn-success btn-sm" onclick="handleResumeDownload(event, '${app._id}')">
                 📄 Download Resume (${app.resume.originalName || 'resume'})
               </a>
              ${app.resume.filename && !app.resume.data ? `
                <div style="margin-top: 8px; padding: 8px; background-color: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px; color: #856404; font-size: 12px;">
                  ⚠️ This resume was uploaded before the system update and may not be available for download.
                </div>
              ` : ''}
            </div>
          ` : ''}
          
          ${app.coverLetter ? `
            <div class="job-requirements">
              <h4>💼 Cover Letter</h4>
              <p>${app.coverLetter}</p>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function updateStats() {
      const total = allApplications.length;
      const pending = allApplications.filter(app => app.status === 'pending').length;
      const accepted = allApplications.filter(app => app.status === 'accepted').length;
      const rejected = allApplications.filter(app => app.status === 'rejected').length;
      
      document.getElementById('totalApplications').textContent = total;
      document.getElementById('pendingApplications').textContent = pending;
      document.getElementById('acceptedApplications').textContent = accepted;
      document.getElementById('rejectedApplications').textContent = rejected;
    }

    function filterApplications() {
      const statusFilter = document.getElementById('statusFilter').value;
      const categoryFilter = document.getElementById('categoryFilter').value;
      const positionFilter = document.getElementById('positionFilter').value;
      const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
      const countryFilter = document.getElementById('countryFilter').value;
      const cityFilter = document.getElementById('cityFilter').value;
      const portFilter = document.getElementById('portFilter').value;
      const customPortInput = document.getElementById('customPortInput');
      
      let filteredApplications = allApplications;
      
      if (statusFilter) {
        filteredApplications = filteredApplications.filter(app => app.status === statusFilter);
      }
      
      if (categoryFilter) {
        filteredApplications = filteredApplications.filter(app => app.jobCategory === categoryFilter);
      }
      
      if (positionFilter) {
        filteredApplications = filteredApplications.filter(app => app.jobPosition === positionFilter);
      }
      
      if (searchFilter) {
        filteredApplications = filteredApplications.filter(app => 
          (app.applicant?.name || '').toLowerCase().includes(searchFilter) ||
          (app.email || '').toLowerCase().includes(searchFilter) ||
          (app.applicant?.email || '').toLowerCase().includes(searchFilter)
        );
      }
      
      // Location filtering
      if (countryFilter) {
        filteredApplications = filteredApplications.filter(app => {
          // Handle both old string format and new object format
          if (typeof app.jobLocation === 'string') {
            return app.jobLocation.toLowerCase().includes(countryFilter.toLowerCase());
          } else if (app.jobLocation && app.jobLocation.country) {
            return app.jobLocation.country.toLowerCase().includes(countryFilter.toLowerCase());
          }
          return false;
        });
      }
      
      if (cityFilter) {
        filteredApplications = filteredApplications.filter(app => {
          if (typeof app.jobLocation === 'string') {
            return app.jobLocation.toLowerCase().includes(cityFilter.toLowerCase());
          } else if (app.jobLocation && app.jobLocation.city) {
            return app.jobLocation.city.toLowerCase().includes(cityFilter.toLowerCase());
          }
          return false;
        });
      }
      
      if (portFilter && portFilter !== 'custom') {
        filteredApplications = filteredApplications.filter(app => {
          if (typeof app.jobLocation === 'string') {
            return app.jobLocation.toLowerCase().includes(portFilter.toLowerCase());
          } else if (app.jobLocation && app.jobLocation.port) {
            return app.jobLocation.port.toLowerCase().includes(portFilter.toLowerCase());
          }
          return false;
        });
      } else if (portFilter === 'custom' && customPortInput.value.trim()) {
        const customPort = customPortInput.value.trim().toLowerCase();
        filteredApplications = filteredApplications.filter(app => {
          if (typeof app.jobLocation === 'string') {
            return app.jobLocation.toLowerCase().includes(customPort);
          } else if (app.jobLocation && app.jobLocation.port) {
            return app.jobLocation.port.toLowerCase().includes(customPort);
          }
          return false;
        });
      }
      
      displayApplications(filteredApplications);
    }

    function clearFilters() {
      document.getElementById('statusFilter').value = '';
      document.getElementById('categoryFilter').value = '';
      document.getElementById('positionFilter').value = '';
      document.getElementById('searchFilter').value = '';
      document.getElementById('countryFilter').value = '';
      document.getElementById('cityFilter').value = '';
      document.getElementById('portFilter').value = '';
      document.getElementById('customPortInput').value = '';
      document.getElementById('customPortInput').style.display = 'none';
      displayApplications(allApplications);
    }

    async function updateApplicationStatus(applicationId, status) {
      const token = localStorage.getItem('token');
      
      // Show loading state
      const button = event.target;
      const originalText = button.innerHTML;
      button.innerHTML = '⏳ Updating...';
      button.disabled = true;
      
      try {
        console.log('Updating application status:', applicationId, status);
        
        const res = await fetch(`/api/v1/jobs/applications/${applicationId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ status })
        });
        
        console.log('Response status:', res.status);
        
        if (res.ok) {
          // Update the application in our local array
          const app = allApplications.find(a => a._id === applicationId);
          if (app) {
            app.status = status;
            console.log('Application status updated locally');
          }
          
          // Refresh the display
          displayApplications(allApplications);
          updateStats();
          
          // Show success message
          showMessage(`Application status updated to ${status}`, 'success');
        } else {
          const errorData = await res.json();
          console.error('API Error:', errorData);
          throw new Error(errorData.message || `HTTP ${res.status}`);
        }
      } catch (error) {
        console.error('Error updating application status:', error);
        showMessage(`Failed to update application status: ${error.message}`, 'error');
      } finally {
        // Restore button state
        button.innerHTML = originalText;
        button.disabled = false;
      }
    }

    function showMessage(message, type = 'info') {
      // Create message element
      const messageDiv = document.createElement('div');
      messageDiv.className = `message message-${type}`;
      messageDiv.style.position = 'fixed';
      messageDiv.style.top = '20px';
      messageDiv.style.right = '20px';
      messageDiv.style.zIndex = '1000';
      messageDiv.style.padding = '12px 20px';
      messageDiv.style.borderRadius = '8px';
      messageDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
      messageDiv.style.maxWidth = '300px';
      messageDiv.textContent = message;
      
      // Add to page
      document.body.appendChild(messageDiv);
      
      // Remove after 3 seconds
      setTimeout(() => {
        if (messageDiv.parentNode) {
          messageDiv.parentNode.removeChild(messageDiv);
        }
      }, 3000);
    }

    async function handleResumeDownload(event, applicationId) {
      const token = localStorage.getItem('token');
      
      // Prevent the default link behavior
      event.preventDefault();
      
      try {
        const response = await fetch(`/api/v1/jobs/applications/${applicationId}/resume`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (!response.ok) {
          const errorData = await response.json();
          
          if (errorData.code === 'OLD_FORMAT') {
            showMessage(`⚠️ ${errorData.message}`, 'warning');
          } else {
            showMessage(`Resume not available: ${errorData.message}`, 'error');
          }
          return false;
        }
        
        // Get the blob from the response
        const blob = await response.blob();
        
        // Create a download link
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `resume_${applicationId}.pdf`; // You can get the filename from response headers if needed
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showMessage('Resume downloaded successfully!', 'success');
        return true;
      } catch (error) {
        console.error('Error downloading resume:', error);
        showMessage('Error downloading resume', 'error');
        return false;
      }
    }

    async function deleteApplication(applicationId) {
      if (!confirm('Are you sure you want to delete this rejected application? This action cannot be undone.')) {
        return;
      }

      const token = localStorage.getItem('token');
      
      try {
        const res = await fetch(`/api/v1/jobs/applications/${applicationId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });
        
        if (res.ok) {
          // Remove the application from our local array
          allApplications = allApplications.filter(app => app._id !== applicationId);
          
          // Refresh the display
          displayApplications(allApplications);
          updateStats();
          
          showMessage('Application deleted successfully', 'success');
        } else {
          const errorData = await res.json();
          throw new Error(errorData.message || `HTTP ${res.status}`);
        }
      } catch (error) {
        console.error('Error deleting application:', error);
        showMessage(`Failed to delete application: ${error.message}`, 'error');
      }
    }

    // Location filtering functions
    async function loadFilterCountries() {
      try {
        const response = await fetch('/api/v1/locations/countries');
        const countries = await response.json();
        
        const countrySelect = document.getElementById('countryFilter');
        countrySelect.innerHTML = '<option value="">All Countries</option>';
        
        countries.forEach(country => {
          countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
        });
      } catch (error) {
        console.error('Error loading countries:', error);
      }
    }

    async function loadFilterCities() {
      const country = document.getElementById('countryFilter').value;
      const citySelect = document.getElementById('cityFilter');
      const portSelect = document.getElementById('portFilter');
      
      // Reset city and port filters
      citySelect.innerHTML = '<option value="">All Cities</option>';
      portSelect.innerHTML = '<option value="">All Ports</option>';
      document.getElementById('customPortInput').style.display = 'none';
      document.getElementById('customPortInput').value = '';
      
      if (!country) {
        filterApplications();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/cities/${encodeURIComponent(country)}`);
        const cities = await response.json();
        
        cities.forEach(city => {
          citySelect.innerHTML += `<option value="${city}">${city}</option>`;
        });
        
        filterApplications();
      } catch (error) {
        console.error('Error loading cities:', error);
        filterApplications();
      }
    }

    async function loadFilterPorts() {
      const country = document.getElementById('countryFilter').value;
      const city = document.getElementById('cityFilter').value;
      const portSelect = document.getElementById('portFilter');
      
      // Reset port filter
      portSelect.innerHTML = '<option value="">All Ports</option>';
      portSelect.innerHTML += '<option value="custom">➕ Add Custom Port</option>';
      document.getElementById('customPortInput').style.display = 'none';
      document.getElementById('customPortInput').value = '';
      
      if (!country || !city) {
        filterApplications();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/ports/${encodeURIComponent(country)}/${encodeURIComponent(city)}`);
        const ports = await response.json();
        
        ports.forEach(port => {
          portSelect.innerHTML += `<option value="${port}">${port}</option>`;
        });
        
        filterApplications();
      } catch (error) {
        console.error('Error loading ports:', error);
        filterApplications();
      }
    }

    function handlePortSelection() {
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      if (portFilter.value === 'custom') {
        customPortInput.style.display = 'block';
        customPortInput.focus();
      } else {
        customPortInput.style.display = 'none';
        customPortInput.value = '';
      }
      
      filterApplications();
    }

    function handleCustomPortInput() {
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      if (portFilter.value === 'custom') {
        // Update the custom option text to show what user is typing
        const customOption = portFilter.querySelector('option[value="custom"]');
        if (customOption) {
          customOption.textContent = customPortInput.value ? `➕ ${customPortInput.value}` : '➕ Add Custom Port';
        }
      }
      
      filterApplications();
    }

    // Mobile menu toggle function
    function toggleMobileMenu() {
      const navLinks = document.getElementById('navLinks');
      navLinks.classList.toggle('show');
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
      const navLinks = document.getElementById('navLinks');
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      
      if (!navLinks.contains(event.target) && !mobileToggle.contains(event.target)) {
        navLinks.classList.remove('show');
      }
    });

    // Load applications and countries when page loads
    document.addEventListener('DOMContentLoaded', async function() {
      await loadAllApplications();
      await loadFilterCountries();
    });
  </script>
</body>
</html>
