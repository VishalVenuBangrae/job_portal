<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Login Page Specific Styles */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }

    /* Animated Background */
    .animated-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      opacity: 0.8;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Elements */
    .floating-elements {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-element {
      position: absolute;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
    }

    .floating-element:nth-child(1) {
      top: 20%;
      left: 10%;
      font-size: 48px;
      animation-delay: 0s;
    }

    .floating-element:nth-child(2) {
      top: 60%;
      right: 15%;
      font-size: 36px;
      animation-delay: 2s;
    }

    .floating-element:nth-child(3) {
      bottom: 30%;
      left: 20%;
      font-size: 24px;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    /* Login Card */
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10;
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.8s ease forwards;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 10px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .login-subtitle {
      color: var(--text-light);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }

    .form-input:focus + .input-icon {
      color: #667eea;
    }

    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      transition: color 0.3s ease;
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .login-links {
      text-align: center;
      margin-top: 20px;
    }

    .login-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .login-links a:hover {
      color: #764ba2;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e1e5e9;
    }

    .divider span {
      background: rgba(255, 255, 255, 0.95);
      padding: 0 15px;
      color: var(--text-light);
      font-size: 12px;
    }

    /* Loading Animation */
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      background: #fee;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      border-left: 4px solid #c53030;
      display: none;
    }

    /* Success Message */
    .success-message {
      background: #f0fff4;
      color: #38a169;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      border-left: 4px solid #38a169;
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-card {
        padding: 30px 20px;
        margin: 20px;
      }
      
      .login-title {
        font-size: 24px;
      }
      
      .form-input {
        font-size: 16px; /* Prevents zoom on iOS */
      }
    }
    
    @media (max-width: 480px) {
      .login-card {
        padding: 20px 15px;
        margin: 10px;
      }
      
      .login-title {
        font-size: 20px;
      }
      
      .login-subtitle {
        font-size: 12px;
      }
      
      .form-input {
        padding: 12px 16px;
        min-height: 44px; /* Touch-friendly */
      }
      
      .btn-login {
        min-height: 44px;
        font-size: 16px;
      }
    }
    
    /* Touch-friendly improvements */
    @media (hover: none) and (pointer: coarse) {
      .btn-login {
        min-height: 44px;
      }
      
      .form-input {
        min-height: 44px;
      }
    }
    
    /* Landscape orientation */
    @media (max-width: 768px) and (orientation: landscape) {
      .login-container {
        padding: 20px 0;
      }
      
      .login-card {
        margin: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <!-- Floating Elements -->
    <div class="floating-elements">
      <div class="floating-element">🔗</div>
      <div class="floating-element">⛵</div>
      <div class="floating-element">🌊</div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🔗</div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your Yacht Crew Portal account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
          <span class="input-icon">📧</span>
        </div>
        
        <div class="form-group">
          <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
          <span class="input-icon">🔒</span>
        </div>

        <button type="submit" class="btn-login">
          <span class="btn-text">Sign In</span>
          <div class="loading-spinner"></div>
        </button>

        <div class="error-message" id="loginError"></div>
        <div class="success-message" id="loginSuccess"></div>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="login-links">
        <p><a href="/signup.html">Create new account</a></p>
        <p><a href="/verify-email.html">Verify your email</a></p>
        <p><a href="/forgot-password.html">Forgot your password?</a></p>
      </div>
    </div>
  </div>

  <script>
    // Temporarily disable auto-redirect to debug the issue
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      const userType = localStorage.getItem('userType');
      
      console.log('Login page loaded - Token:', !!token, 'UserType:', userType);
      
      // Comment out auto-redirect for debugging
      /*
      if (token && userType) {
        console.log('User already logged in, redirecting to dashboard');
        // Already logged in, redirect to appropriate dashboard
        if (userType === 'employer') {
          window.location.href = '/employer.html';
        } else {
          window.location.href = '/jobseeker.html';
        }
      } else {
        console.log('No valid login found, staying on login page');
      }
      */
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btnText = document.querySelector('.btn-text');
      const spinner = document.querySelector('.loading-spinner');
      const errorDiv = document.getElementById('loginError');
      const successDiv = document.getElementById('loginSuccess');
      
      // Hide previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Show loading state
      btnText.textContent = 'Signing In...';
      spinner.style.display = 'inline-block';
      
      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          console.log('Login successful, storing data:', { userType: data.userType, hasToken: !!data.token });
          
          // Store token and user type
          localStorage.setItem('token', data.token);
          localStorage.setItem('userType', data.userType);
          
          // Show success message
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.style.display = 'block';
          
          // Redirect based on user type
          setTimeout(() => {
            console.log('Redirecting to dashboard...');
            if (data.userType === 'employer') {
              window.location.href = '/employer.html';
            } else {
              window.location.href = '/jobseeker.html';
            }
          }, 1000);
          
        } else {
          // Show error message
          errorDiv.textContent = data.message || 'Login failed. Please try again.';
          errorDiv.style.display = 'block';
        }
        
      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = `Network error: ${error.message}. Please check your connection.`;
        errorDiv.style.display = 'block';
      } finally {
        // Reset button state
        btnText.textContent = 'Sign In';
        spinner.style.display = 'none';
      }
    });

    // Add some interactive effects
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
