<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f7">
  <title>Login - Nauti Crew Agency</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
  <style>
    .loading-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="nca-auth">
  <div class="nca-auth-card">
    <div class="nca-auth-logo">
      <img src="/images/nca-logo.png" alt="Nauti Crew Agency">
      <div class="eyebrow">Nauti Crew Agency</div>
    </div>
    <h1 class="nca-auth-title">Welcome aboard</h1>
    <p class="nca-auth-subtitle">Sign in to find daywork — or post your next crew call</p>

    <form id="loginForm">
      <div class="form-group">
        <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
        <span class="input-icon">@</span>
      </div>

      <div class="form-group">
        <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
        <span class="input-icon">*</span>
      </div>

      <button type="submit" class="nca-auth-btn">
        <span class="btn-text">Sign In</span>
        <span class="loading-spinner"></span>
      </button>

      <div class="error-message" id="loginError"></div>
      <div class="success-message" id="loginSuccess"></div>
    </form>

    <div class="nca-divider"><span>or</span></div>

    <div class="nca-auth-links">
      <p><a href="/signup.html">Create new account</a></p>
      <p><a href="/verify-email.html">Verify your email</a></p>
      <p><a href="/forgot-password.html">Forgot your password?</a></p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const emailFromUrl = urlParams.get('email');
      if (emailFromUrl) {
        document.getElementById('email').value = emailFromUrl;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btnText = document.querySelector('.btn-text');
      const spinner = document.querySelector('.loading-spinner');
      const errorDiv = document.getElementById('loginError');
      const successDiv = document.getElementById('loginSuccess');
      
      // Hide previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Show loading state
      btnText.textContent = 'Signing In...';
      spinner.style.display = 'inline-block';
      
      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          console.log('Login successful, storing data:', { userType: data.userType, hasToken: !!data.token });
          
          // Store token and user type
          localStorage.setItem('token', data.token);
          localStorage.setItem('userType', data.userType);
          
          // Show success message
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.style.display = 'block';
          
          // Redirect based on user type
          setTimeout(() => {
            if (data.userType === 'employer') {
              window.location.href = '/employer.html';
            } else if (!data.profileComplete) {
              window.location.href = '/crew-profile.html';
            } else {
              window.location.href = '/jobseeker.html';
            }
          }, 1000);
          
        } else {
          // Show error message
          errorDiv.textContent = data.message || 'Login failed. Please try again.';
          errorDiv.style.display = 'block';
        }
        
      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = `Network error: ${error.message}. Please check your connection.`;
        errorDiv.style.display = 'block';
      } finally {
        // Reset button state
        btnText.textContent = 'Sign In';
        spinner.style.display = 'none';
      }
    });

    // Add some interactive effects
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
