<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <span class="logo-icon">🔗</span>
        <span>Yacht Crew Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Dashboard</a>
        <a href="/change-password.html" class="nav-link active">Settings</a>
        <a href="/login.html" class="nav-link" onclick="logout()">Logout</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
      <div class="card-header">
        <h2>🔐 Change Password</h2>
      </div>
      <div class="card-body">
        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label">Current Password *</label>
            <input type="password" name="currentPassword" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">New Password *</label>
            <input type="password" name="newPassword" class="form-input" required minlength="6">
            <small style="color: var(--text-light); margin-top: 4px; display: block;">
              Password must be at least 6 characters long
            </small>
          </div>
          
          <div class="form-group">
            <label class="form-label">Confirm New Password *</label>
            <input type="password" name="confirmPassword" class="form-input" required minlength="6">
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            🔐 Change Password
          </button>
          
          <div id="changePassError" class="message message-error" style="display: none;"></div>
          <div id="changePassSuccess" class="message message-success" style="display: none;"></div>
        </form>
        
        <div style="text-align: center; margin-top: 24px;">
          <a href="/index.html" class="btn btn-outline">← Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userType');
      window.location.href = '/login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const changePasswordForm = document.getElementById('changePasswordForm');
      const errorDiv = document.getElementById('changePassError');
      const successDiv = document.getElementById('changePassSuccess');

      if (changePasswordForm) {
        changePasswordForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const currentPassword = this.currentPassword.value;
          const newPassword = this.newPassword.value;
          const confirmPassword = this.confirmPassword.value;
          
          // Clear previous messages
          errorDiv.style.display = 'none';
          successDiv.style.display = 'none';

          // Validate passwords match
          if (newPassword !== confirmPassword) {
            errorDiv.textContent = 'New passwords do not match';
            errorDiv.style.display = 'block';
            return;
          }

          if (newPassword.length < 6) {
            errorDiv.textContent = 'Password must be at least 6 characters long';
            errorDiv.style.display = 'block';
            return;
          }

          try {
            const res = await fetch('/api/v1/auth/change-password', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            if (!res.ok) {
              errorDiv.textContent = data.message || 'Failed to change password';
              errorDiv.style.display = 'block';
              return;
            }
            successDiv.textContent = '✅ Password changed successfully!';
            successDiv.style.display = 'block';
            changePasswordForm.reset();
          } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
          }
        });
      }
    });
  </script>
</body>
</html>
