<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post New Job - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="/employer.html" class="logo">
        <span class="logo-icon">🔗</span>
        <span>Yacht Crew Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/employer.html" class="nav-link">Dashboard</a>
        <a href="/post-job.html" class="nav-link active">Post Job</a>
        <a href="/employer-applications.html" class="nav-link">Applications</a>
        <a href="/change-password.html" class="nav-link">Settings</a>
        <a href="/login.html" class="nav-link" onclick="logout()">Logout</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>🚀 Post New Job</h2>
      </div>
      <div class="card-body">
        <form id="postJobForm">
          <div class="form-group">
            <label class="form-label">Job Title *</label>
            <input type="text" name="title" class="form-input" required placeholder="e.g., Captain, Deckhand, Chef">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Company Name *</label>
              <input type="text" name="company" class="form-input" required placeholder="Your company name">
            </div>
            <div class="form-group">
              <label class="form-label">Location *</label>
              <input type="text" name="location" class="form-input" required placeholder="e.g., Monaco, Miami, Antibes">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Salary *</label>
              <input type="text" name="salary" class="form-input" required placeholder="e.g., 3000 EUR/month, 5000 USD/week">
            </div>
            <div class="form-group">
              <label class="form-label">Job Type *</label>
              <select name="jobType" class="form-select" required>
                <option value="">Select Job Type</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Temporary">Temporary</option>
              </select>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Category *</label>
              <select name="jobCategory" class="form-select" required onchange="updatePositionOptions()">
                <option value="">Select Category</option>
                <option value="Daywork/Freelance">Daywork/Freelance</option>
                <option value="Deliveries">Deliveries</option>
              </select>
              <small style="color: var(--text-light); margin-top: 4px; display: block;">
                Daywork/Freelance: Regular yacht crew positions<br>
                Deliveries: Yacht delivery and transit positions
              </small>
            </div>
            <div class="form-group">
              <label class="form-label">Position *</label>
              <select name="position" class="form-select" required id="positionSelect">
                <option value="">Select Category First</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Job Description *</label>
            <textarea name="description" class="form-textarea" required placeholder="Provide a detailed description of the job, responsibilities, and what you're looking for in a candidate..."></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">Requirements</label>
            <input type="text" name="requirements" class="form-input" placeholder="e.g., STCW, Yachtmaster, 2+ years experience (comma separated)">
            <small style="color: var(--text-light); margin-top: 4px; display: block;">
              Separate multiple requirements with commas
            </small>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
            🚀 Post Job
          </button>
          
          <div id="formError" class="message message-error" style="display: none;"></div>
          <div id="formSuccess" class="message message-success" style="display: none;"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userType');
      window.location.href = '/login.html';
    }

    function updatePositionOptions() {
      const categorySelect = document.querySelector('select[name="jobCategory"]');
      const positionSelect = document.getElementById('positionSelect');
      const category = categorySelect.value;
      
      positionSelect.innerHTML = '<option value="">Select Position</option>';
      
      if (category === 'Daywork/Freelance') {
        const positions = [
          'Captain', 'Engineer', 'Bosun', 'Mate', 'Deckhand', 
          'Chef/crew cook', 'Chief Stewardess', '2nd Stewardess'
        ];
        positions.forEach(pos => {
          const option = document.createElement('option');
          option.value = pos;
          option.textContent = pos;
          positionSelect.appendChild(option);
        });
      } else if (category === 'Deliveries') {
        const positions = ['Captain', 'Mate', 'Stewardess', 'Chef/crew cook'];
        positions.forEach(pos => {
          const option = document.createElement('option');
          option.value = pos;
          option.textContent = pos;
          positionSelect.appendChild(option);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const postJobForm = document.getElementById('postJobForm');
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('formError');
      const successDiv = document.getElementById('formSuccess');

      if (postJobForm) {
        postJobForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          // Clear previous messages
          errorDiv.style.display = 'none';
          successDiv.style.display = 'none';
          
          // Disable submit button
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<div class="spinner"></div> Posting Job...';

          const formData = new FormData(this);
          const jobData = {
            title: formData.get('title'),
            company: formData.get('company'),
            location: formData.get('location'),
            jobCategory: formData.get('jobCategory'),
            position: formData.get('position'),
            description: formData.get('description'),
            requirements: formData.get('requirements').split(',').map(req => req.trim()).filter(req => req),
            salary: formData.get('salary'),
            jobType: formData.get('jobType')
          };

          try {
            const res = await fetch('/api/v1/jobs', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify(jobData)
            });

            if (res.ok) {
              successDiv.textContent = '✅ Job posted successfully! Redirecting to dashboard...';
              successDiv.style.display = 'block';
              this.reset();
              // Redirect to dashboard after 2 seconds
              setTimeout(() => {
                window.location.href = '/employer.html';
              }, 2000);
            } else {
              const data = await res.json();
              errorDiv.textContent = data.message || 'Failed to post job';
              errorDiv.style.display = 'block';
            }
          } catch (error) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
          } finally {
            // Re-enable submit button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🚀 Post Job';
          }
        });
      }
    });
  </script>
</body>
</html>
