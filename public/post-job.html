<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post New Job - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
</head>
<body class="nca-app" data-nca-role="employer" data-nca-page="post-job" data-nca-title="Post New Job" data-nca-subtitle="Create a new crew position listing">
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>Post New Job</h2>
      </div>
      <div class="card-body">
        <form id="postJobForm">
          <div class="form-group">
            <label class="form-label">Job Title *</label>
            <input type="text" name="title" class="form-input" required placeholder="e.g., Captain, Deckhand, Chef">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Company Name *</label>
              <input type="text" name="company" class="form-input" required placeholder="Your company name">
            </div>
            <div class="form-group">
              <label class="form-label">Location *</label>
              <div class="location-selector">
                <select name="country" class="form-select" required onchange="loadCities()">
                  <option value="">Select Country</option>
                </select>
                <select name="city" class="form-select" required onchange="loadPorts()" disabled>
                  <option value="">Select City</option>
                </select>
                <select name="port" class="form-select" onchange="handlePortSelection()">
                  <option value="">Select Port (Optional)</option>
                </select>
                <input type="text" name="customPort" class="form-input" placeholder="Or type custom port name..." style="display: none;" onkeyup="handleCustomPortInput()">
                <input type="text" name="locationDisplay" class="form-input" readonly placeholder="Location will be displayed here">
              </div>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Salary *</label>
              <input type="text" name="salary" class="form-input" required placeholder="e.g., 3000 EUR/month, 5000 USD/week">
            </div>
            <div class="form-group">
              <label class="form-label">Job Type *</label>
              <select name="jobType" class="form-select" required>
                <option value="">Select Job Type</option>
                <option value="Daywork">Daywork</option>
                <option value="Freelance">Freelance</option>
                <option value="Delivery">Delivery</option>
              </select>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Vessel Flag *</label>
              <select name="vesselFlag" class="form-select" required>
                <option value="">Select Vessel Flag</option>
                <option value="US flagged">US flagged</option>
                <option value="Foreign Flagged">Foreign Flagged</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Position *</label>
              <select name="position" class="form-select" required>
                <option value="">Select Position</option>
                <option value="Captain">Captain</option>
                <option value="Engineer">Engineer</option>
                <option value="Bosun">Bosun</option>
                <option value="Mate">Mate</option>
                <option value="Deckhand">Deckhand</option>
                <option value="Chef/crew cook">Chef/crew cook</option>
                <option value="Chief Stewardess">Chief Stewardess</option>
                <option value="2nd Stewardess">2nd Stewardess</option>
                <option value="Stewardess">Stewardess</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Job Description *</label>
            <textarea name="description" class="form-textarea" required placeholder="Provide a detailed description of the job, responsibilities, and what you're looking for in a candidate..."></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">Requirements</label>
            <input type="text" name="requirements" class="form-input" placeholder="e.g., STCW, Yachtmaster, 2+ years experience (comma separated)">
            <small style="color: var(--text-light); margin-top: 4px; display: block;">
              Separate multiple requirements with commas
            </small>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
            🚀 Post Job
          </button>
          
          <div id="formError" class="message message-error" style="display: none;"></div>
          <div id="formSuccess" class="message message-success" style="display: none;"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function logout() { ncaLogout(); }

    // Location handling functions
    async function loadCountries() {
      try {
        const response = await fetch('/api/v1/locations/countries');
        const countries = await response.json();
        
        const countrySelect = document.querySelector('select[name="country"]');
        countrySelect.innerHTML = '<option value="">Select Country</option>';
        
        countries.forEach(country => {
          const option = document.createElement('option');
          option.value = country;
          option.textContent = country;
          countrySelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading countries:', error);
      }
    }

    async function loadCities() {
      const countrySelect = document.querySelector('select[name="country"]');
      const citySelect = document.querySelector('select[name="city"]');
      const portSelect = document.querySelector('select[name="port"]');
      
      const country = countrySelect.value;
      
      // Reset city and port
      citySelect.innerHTML = '<option value="">Select City</option>';
      portSelect.innerHTML = '<option value="">Select Port (Optional)</option>';
      
      if (!country) {
        citySelect.disabled = true;
        portSelect.disabled = true;
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/cities/${encodeURIComponent(country)}`);
        const cities = await response.json();
        
        citySelect.disabled = false;
        
        cities.forEach(city => {
          const option = document.createElement('option');
          option.value = city;
          option.textContent = city;
          citySelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading cities:', error);
      }
    }

    async function loadPorts() {
      const countrySelect = document.querySelector('select[name="country"]');
      const citySelect = document.querySelector('select[name="city"]');
      const portSelect = document.querySelector('select[name="port"]');
      const customPortInput = document.querySelector('input[name="customPort"]');
      
      const country = countrySelect.value;
      const city = citySelect.value;
      
      // Reset port and custom input
      portSelect.innerHTML = '<option value="">Select Port (Optional)</option>';
      customPortInput.style.display = 'none';
      customPortInput.value = '';
      
      if (!country || !city) {
        portSelect.disabled = true;
        customPortInput.style.display = 'none';
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/ports/${encodeURIComponent(country)}/${encodeURIComponent(city)}`);
        const ports = await response.json();
        
        portSelect.disabled = false;
        
        if (ports.length > 0) {
          ports.forEach(port => {
            const option = document.createElement('option');
            option.value = port;
            option.textContent = port;
            portSelect.appendChild(option);
          });
        }
        
        // Add "Add Custom Port" option
        const customOption = document.createElement('option');
        customOption.value = 'custom';
        customOption.textContent = '➕ Add Custom Port';
        portSelect.appendChild(customOption);
      } catch (error) {
        console.error('Error loading ports:', error);
      }
      
      updateLocationDisplay();
    }

    function handlePortSelection() {
      const portSelect = document.querySelector('select[name="port"]');
      const customPortInput = document.querySelector('input[name="customPort"]');
      
      if (portSelect.value === 'custom') {
        // Show custom port input
        customPortInput.style.display = 'block';
        customPortInput.focus();
        customPortInput.value = '';
      } else {
        // Hide custom port input and update display
        customPortInput.style.display = 'none';
        customPortInput.value = '';
        updateLocationDisplay();
      }
    }

    function handleCustomPortInput() {
      const customPortInput = document.querySelector('input[name="customPort"]');
      const portName = customPortInput.value.trim();
      
      if (portName.length > 0) {
        // Update the port select to show the custom port name
        const portSelect = document.querySelector('select[name="port"]');
        const customOption = portSelect.querySelector('option[value="custom"]');
        if (customOption) {
          customOption.textContent = `➕ Add Custom Port (${portName})`;
        }
        
        // Update location display
        updateLocationDisplay();
      }
    }

    function updateLocationDisplay() {
      const countrySelect = document.querySelector('select[name="country"]');
      const citySelect = document.querySelector('select[name="city"]');
      const portSelect = document.querySelector('select[name="port"]');
      const customPortInput = document.querySelector('input[name="customPort"]');
      const displayInput = document.querySelector('input[name="locationDisplay"]');
      
      const country = countrySelect.value;
      const city = citySelect.value;
      const port = portSelect.value;
      const customPort = customPortInput.value.trim();
      
      let displayText = '';
      if (city && country) {
        displayText = city;
        
        // Handle custom port input
        if (port === 'custom' && customPort) {
          displayText += `, ${customPort}`;
        } else if (port && port !== 'custom') {
          displayText += `, ${port}`;
        }
        
        displayText += `, ${country}`;
      }
      
      displayInput.value = displayText;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const postJobForm = document.getElementById('postJobForm');
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('formError');
      const successDiv = document.getElementById('formSuccess');

      // Mobile menu toggle function
      function toggleMobileMenu() {
        const navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('show');
      }

      // Close mobile menu when clicking outside
      document.addEventListener('click', function(event) {
        const navLinks = document.getElementById('navLinks');
        const mobileToggle = document.querySelector('.mobile-menu-toggle');
        
        if (!navLinks.contains(event.target) && !mobileToggle.contains(event.target)) {
          navLinks.classList.remove('show');
        }
      });

      // Load countries when page loads
      loadCountries();

      if (postJobForm) {
        postJobForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          // Clear previous messages
          errorDiv.style.display = 'none';
          successDiv.style.display = 'none';
          
          // Disable submit button
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<div class="spinner"></div> Posting Job...';

          const formData = new FormData(this);
          // Handle custom port
          const port = formData.get('port');
          const customPort = formData.get('customPort');
          let finalPort = '';
          
          if (port === 'custom' && customPort.trim()) {
            finalPort = customPort.trim();
          } else if (port && port !== 'custom') {
            finalPort = port;
          }

          const jobData = {
            title: formData.get('title'),
            company: formData.get('company'),
            location: {
              country: formData.get('country'),
              city: formData.get('city'),
              port: finalPort,
              displayName: formData.get('locationDisplay')
            },
            jobCategory: formData.get('jobType'),
            position: formData.get('position'),
            vesselFlag: formData.get('vesselFlag'),
            description: formData.get('description'),
            requirements: formData.get('requirements').split(',').map(req => req.trim()).filter(req => req),
            salary: formData.get('salary'),
            jobType: formData.get('jobType')
          };

          try {
            const res = await fetch('/api/v1/jobs', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify(jobData)
            });

            if (res.ok) {
              successDiv.textContent = '✅ Job posted successfully! Redirecting to dashboard...';
              successDiv.style.display = 'block';
              this.reset();
              // Redirect to dashboard after 2 seconds
              setTimeout(() => {
                window.location.href = '/employer.html';
              }, 2000);
            } else {
              const data = await res.json();
              errorDiv.textContent = data.message || 'Failed to post job';
              errorDiv.style.display = 'block';
            }
          } catch (error) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
          } finally {
            // Re-enable submit button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🚀 Post Job';
          }
        });
      }
    });
  </script>
  <script src="/nca-layout.js"></script>
</body>
</html>
