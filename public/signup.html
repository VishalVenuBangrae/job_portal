<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Crew - Nauti Crew Agency</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
  <style>
    .nca-auth-card { max-width: 500px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
    .loading-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="nca-auth">
  <div class="nca-auth-card">
    <div class="nca-auth-logo">
      <img src="/images/nca-logo.png" alt="Nauti Crew Agency">
      <div class="eyebrow">Nauti Crew Agency</div>
    </div>
    <h1 class="nca-auth-title">Join the crew</h1>
    <p class="nca-auth-subtitle">Create your account — then complete your profile to get selected</p>

    <form id="signupForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="form-group">
          <input type="text" class="form-input" id="firstName" placeholder="First Name" required>
          <span class="input-icon">@</span>
        </div>

        <div class="form-group">
          <input type="text" class="form-input" id="lastName" placeholder="Last Name" required>
          <span class="input-icon">@</span>
        </div>
      </div>

      <div class="form-group">
        <input type="email" class="form-input" id="email" placeholder="Email Address" required>
        <span class="input-icon">@</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <input type="password" class="form-input" id="password" placeholder="Password" required>
          <span class="input-icon">*</span>
        </div>

        <div class="form-group">
          <input type="tel" class="form-input" id="phone" placeholder="Phone Number" required>
          <span class="input-icon">#</span>
        </div>
      </div>

      <div class="nca-user-type-toggle user-type-toggle">
        <div class="nca-user-type-option user-type-option active" data-type="jobseeker">
          <span>Crew Member</span>
        </div>
        <div class="nca-user-type-option user-type-option" data-type="employer">
          <span>Employer</span>
        </div>
      </div>

      <div class="form-group" id="resumeField" style="display: none;">
        <!-- Resume collected on crew profile page -->
      </div>

      <button type="submit" class="nca-auth-btn btn-signup">
        <span class="btn-text">Join the Crew</span>
        <span class="loading-spinner"></span>
      </button>

      <div class="nca-error error-message" id="signupError"></div>
      <div class="nca-success success-message" id="signupSuccess"></div>
    </form>

    <div class="nca-divider"><span>or</span></div>

    <div class="nca-auth-links">
      <p>Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script>
    // User type toggle functionality
    const userTypeOptions = document.querySelectorAll('.user-type-option');
    const resumeField = document.getElementById('resumeField');
    const userTypeInput = document.createElement('input');
    userTypeInput.type = 'hidden';
    userTypeInput.name = 'userType';
    userTypeInput.value = 'jobseeker';
    document.getElementById('signupForm').appendChild(userTypeInput);

    userTypeOptions.forEach(option => {
      option.addEventListener('click', function() {
        // Remove active class from all options
        userTypeOptions.forEach(opt => opt.classList.remove('active'));
        
        // Add active class to clicked option
        this.classList.add('active');
        
        // Update hidden input value
        const userType = this.dataset.type;
        userTypeInput.value = userType;
        
        // Crew members complete profile after signup
        if (userType === 'jobseeker') {
          resumeField.style.display = 'none';
        } else {
          resumeField.style.display = 'none';
        }
      });
    });

    // Form submission
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('firstName', document.getElementById('firstName').value);
      formData.append('lastName', document.getElementById('lastName').value);
      formData.append('name', `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`.trim());
      formData.append('email', document.getElementById('email').value);
      formData.append('password', document.getElementById('password').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('userType', userTypeInput.value);
      
      const btnText = document.querySelector('.btn-text');
      const spinner = document.querySelector('.loading-spinner');
      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');
      
      // Hide previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Show loading state
      btnText.textContent = 'Creating Account...';
      spinner.style.display = 'inline-block';
      
      try {
        const response = await fetch('/api/v1/auth/register', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('userType', data.userType);

          successDiv.textContent = 'Account created! Please check your email for a verification code.';
          successDiv.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/verify-email.html?email=' + encodeURIComponent(data.email);
          }, 2000);
          
        } else {
          // Show error message
          errorDiv.textContent = data.message || 'Signup failed. Please try again.';
          errorDiv.style.display = 'block';
        }
        
      } catch (error) {
        console.error('Signup error:', error);
        errorDiv.textContent = 'Network error. Please check your connection.';
        errorDiv.style.display = 'block';
      } finally {
        // Reset button state
        btnText.textContent = 'Join the Crew';
        spinner.style.display = 'none';
      }
    });

    // Add some interactive effects
    document.querySelectorAll('.form-input, .form-select').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
