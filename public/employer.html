<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
    h1 { text-align: center; }
    form { margin-bottom: 2em; }
    label { display: block; margin-top: 1em; }
    input, textarea { width: 100%; padding: 0.5em; margin-top: 0.2em; }
    button { margin-top: 1em; padding: 0.7em 2em; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .jobs { margin-top: 2em; }
    .job { background: #f9f9f9; padding: 1em; border-radius: 4px; margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Employer Dashboard</h1>
    <form id="postJobForm">
      <label>Title: <input type="text" name="title" required></label>
      <label>Company: <input type="text" name="company" required></label>
      <label>Location: <input type="text" name="location" required></label>
      <label>Description: <textarea name="description" required></textarea></label>
      <label>Requirements: <input type="text" name="requirements" placeholder="Comma separated"></label>
      <label>Salary: <input type="text" name="salary" required></label>
      <label>Job Type: <select name="jobType" required>
        <option value="Full-time">Full-time</option>
        <option value="Part-time">Part-time</option>
        <option value="Contract">Contract</option>
        <option value="Temporary">Temporary</option>
      </select></label>
      <button type="submit">Post Job</button>
    </form>
    <div class="jobs">
      <h2>Your Posted Jobs</h2>
      <div class="job">
        <strong>Deckhand</strong> at Yacht Co, Monaco<br>
        <small>Full-time | 3000 EUR/month</small>
        <p>Looking for experienced deckhand.</p>
        <button class="view-applications" data-jobid="demoJobId">View Applications</button>
        <div class="applications hidden"></div>
      </div>
      <!-- More jobs can be listed here dynamically -->
    </div>
    <form id="changePasswordForm" style="margin-top:2em;">
      <h2>Change Password</h2>
      <label>Current Password: <input type="password" name="currentPassword" required></label>
      <label>New Password: <input type="password" name="newPassword" required></label>
      <button type="submit">Change Password</button>
      <div class="error" id="changePassError"></div>
      <div class="success" id="changePassSuccess"></div>
    </form>
    <button id="logoutBtn" style="margin-top:2em;">Logout</button>
    <a href="/index.html">Back to Home</a>
  </div>
  <script src="/employer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.onclick = function() {
          localStorage.removeItem('token');
          localStorage.removeItem('userType');
          window.location.href = '/login.html';
        };
      }
      // Change password form
      const changePasswordForm = document.getElementById('changePasswordForm');
      if (changePasswordForm) {
        changePasswordForm.onsubmit = async function(e) {
          e.preventDefault();
          const currentPassword = this.currentPassword.value;
          const newPassword = this.newPassword.value;
          const errorDiv = document.getElementById('changePassError');
          const successDiv = document.getElementById('changePassSuccess');
          errorDiv.textContent = '';
          successDiv.textContent = '';
          try {
            const res = await fetch('/api/v1/auth/change-password', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
              },
              body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            if (!res.ok) {
              errorDiv.textContent = data.message || 'Failed to change password';
              return;
            }
            successDiv.textContent = 'Password changed successfully!';
            changePasswordForm.reset();
          } catch (err) {
            errorDiv.textContent = 'Network error';
          }
        };
      }
    });
  </script>
</body>
</html>
