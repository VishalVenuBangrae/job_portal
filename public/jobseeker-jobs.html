<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
</head>
<body class="nca-app" data-nca-role="jobseeker" data-nca-page="jobs" data-nca-title="Browse Jobs" data-nca-subtitle="Search and apply for yacht crew positions">
  <div class="container">
    <div class="filter-section">
      <h3>Filter Jobs</h3>
      <div class="filter-row">
        <select id="categoryFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Categories</option>
          <option value="Daywork">Daywork</option>
          <option value="Freelance">Freelance</option>
          <option value="Delivery">Delivery</option>
        </select>
        <select id="positionFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Positions</option>
          <option value="Captain">Captain</option>
          <option value="Engineer">Engineer</option>
          <option value="Bosun">Bosun</option>
          <option value="Mate">Mate</option>
          <option value="Deckhand">Deckhand</option>
          <option value="Chef/crew cook">Chef/crew cook</option>
          <option value="Chief Stewardess">Chief Stewardess</option>
          <option value="2nd Stewardess">2nd Stewardess</option>
          <option value="Stewardess">Stewardess</option>
        </select>
        <select id="jobTypeFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Job Types</option>
          <option value="Daywork">Daywork</option>
          <option value="Freelance">Freelance</option>
          <option value="Delivery">Delivery</option>
        </select>
        <select id="countryFilter" class="filter-select" onchange="loadFilterCities()">
          <option value="">All Countries</option>
        </select>
        <select id="cityFilter" class="filter-select" onchange="loadFilterPorts()" disabled>
          <option value="">All Cities</option>
        </select>
        <select id="portFilter" class="filter-select" onchange="handlePortSelection()" disabled>
          <option value="">All Ports</option>
        </select>
        <input type="text" id="customPortInput" class="filter-input" placeholder="Or type custom port name..." style="display: none;" onkeyup="handleCustomPortInput()">
        <input type="text" id="searchFilter" class="filter-input" placeholder="Search jobs..." onkeyup="filterJobs()">
        <button class="btn btn-outline" onclick="clearFilters()">Clear Filters</button>
      </div>
    </div>

    <div id="jobsList">
      <div class="loading">
        <div class="spinner"></div>
        Loading jobs...
      </div>
    </div>
  </div>

  <!-- Application Modal -->
  <div id="applicationModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Apply for Job</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="applicationForm">
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-input" required placeholder="your.email@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" name="phone" class="form-input" required placeholder="+1 (555) 123-4567">
          </div>
          <div class="form-group">
            <label class="form-label">Cover Letter *</label>
            <textarea name="coverLetter" class="form-textarea" required placeholder="Tell us why you're interested in this position and why you'd be a great fit..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Resume *</label>
            <input type="file" name="resume" class="form-input" accept=".pdf,.doc,.docx" required>
            <small style="color: var(--text-light); margin-top: 4px; display: block;">
              PDF, DOC, or DOCX files only (max 5MB)
            </small>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" style="width: 100%;">
            Submit Application
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let allJobs = [];
    let currentJobId = null;

    function logout() { ncaLogout(); }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function loadJobs() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        // Build query parameters for filtering
        const params = new URLSearchParams();
        const countryFilter = document.getElementById('countryFilter').value;
        const cityFilter = document.getElementById('cityFilter').value;
        const portFilter = document.getElementById('portFilter').value;
        const customPortInput = document.getElementById('customPortInput');
        const categoryFilter = document.getElementById('categoryFilter').value;
        const positionFilter = document.getElementById('positionFilter').value;
        const jobTypeFilter = document.getElementById('jobTypeFilter').value;
        const searchFilter = document.getElementById('searchFilter').value;

        if (countryFilter) params.append('country', countryFilter);
        if (cityFilter) params.append('city', cityFilter);
        
        // Handle custom port input
        if (portFilter === 'custom' && customPortInput.value.trim()) {
          params.append('port', customPortInput.value.trim());
        } else if (portFilter && portFilter !== 'custom') {
          params.append('port', portFilter);
        }
        
        if (categoryFilter) params.append('jobCategory', categoryFilter);
        if (positionFilter) params.append('position', positionFilter);
        if (jobTypeFilter) params.append('jobType', jobTypeFilter);
        if (searchFilter) params.append('search', searchFilter);

        const res = await fetch(`/api/v1/jobs?${params.toString()}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const jobs = await res.json();
        
        // Sort by newest first
        allJobs = jobs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        displayJobs(allJobs);
      } catch (error) {
        document.getElementById('jobsList').innerHTML = `
          <div class="message message-error">
            Error loading jobs. Please try again later.
          </div>
        `;
      }
    }

    function displayJobs(jobs) {
      const jobsDiv = document.getElementById('jobsList');
      
      if (jobs.length === 0) {
        jobsDiv.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <h3>No jobs available</h3>
            <p>No jobs match your current filters. Try adjusting your search criteria.</p>
          </div>
        `;
        return;
      }

      jobsDiv.innerHTML = jobs.map(job => `
        <div class="job-card">
          <div class="job-header">
            <div>
              <div class="job-title">${job.title}</div>
              <div class="job-company">${job.company}</div>
              <div class="job-meta">
                <span class="job-tag job-category">${job.jobCategory}</span>
                <span class="job-tag job-position">${job.position}</span>
                <span class="job-tag job-type">${job.jobType}</span>
                <span class="job-tag job-location">${job.location.displayName || job.location}</span>
                <span class="job-tag job-salary">${job.salary}</span>
              </div>
              <div class="job-date">Posted: ${formatDate(job.createdAt)}</div>
            </div>
            <div>
              <button onclick="openApplicationModal('${job._id}')" class="btn btn-success">
                Apply Now
              </button>
            </div>
          </div>
          
          <div class="job-description">
            <strong>Description:</strong><br>
            ${job.description}
          </div>
          
          ${job.requirements && job.requirements.length > 0 ? `
            <div class="job-requirements">
              <h4>Requirements</h4>
              ${job.requirements.join(', ')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function filterJobs() {
      // Use server-side filtering instead of client-side
      loadJobs();
    }

    // Location filtering functions
    async function loadFilterCountries() {
      try {
        const response = await fetch('/api/v1/locations/countries');
        const countries = await response.json();
        
        const countryFilter = document.getElementById('countryFilter');
        countryFilter.innerHTML = '<option value="">All Countries</option>';
        
        countries.forEach(country => {
          const option = document.createElement('option');
          option.value = country;
          option.textContent = country;
          countryFilter.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading countries:', error);
      }
    }

    async function loadFilterCities() {
      const countryFilter = document.getElementById('countryFilter');
      const cityFilter = document.getElementById('cityFilter');
      const portFilter = document.getElementById('portFilter');
      
      const country = countryFilter.value;
      
      // Reset city and port filters
      cityFilter.innerHTML = '<option value="">All Cities</option>';
      portFilter.innerHTML = '<option value="">All Ports</option>';
      
      if (!country) {
        cityFilter.disabled = true;
        portFilter.disabled = true;
        loadJobs();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/cities/${encodeURIComponent(country)}`);
        const cities = await response.json();
        
        cityFilter.disabled = false;
        
        cities.forEach(city => {
          const option = document.createElement('option');
          option.value = city;
          option.textContent = city;
          cityFilter.appendChild(option);
        });
        
        loadJobs();
      } catch (error) {
        console.error('Error loading cities:', error);
      }
    }

    async function loadFilterPorts() {
      const countryFilter = document.getElementById('countryFilter');
      const cityFilter = document.getElementById('cityFilter');
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      const country = countryFilter.value;
      const city = cityFilter.value;
      
      // Reset port filter and custom input
      portFilter.innerHTML = '<option value="">All Ports</option>';
      customPortInput.style.display = 'none';
      customPortInput.value = '';
      
      if (!country || !city) {
        portFilter.disabled = true;
        customPortInput.style.display = 'none';
        loadJobs();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/ports/${encodeURIComponent(country)}/${encodeURIComponent(city)}`);
        const ports = await response.json();
        
        portFilter.disabled = false;
        
        if (ports.length > 0) {
          ports.forEach(port => {
            const option = document.createElement('option');
            option.value = port;
            option.textContent = port;
            portFilter.appendChild(option);
          });
        }
        
        // Add "Add Custom Port" option
        const customOption = document.createElement('option');
        customOption.value = 'custom';
        customOption.textContent = '➕ Add Custom Port';
        portFilter.appendChild(customOption);
        
        loadJobs();
      } catch (error) {
        console.error('Error loading ports:', error);
      }
    }

    function handlePortSelection() {
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      if (portFilter.value === 'custom') {
        // Show custom port input
        customPortInput.style.display = 'block';
        customPortInput.focus();
        customPortInput.value = '';
      } else {
        // Hide custom port input and filter jobs
        customPortInput.style.display = 'none';
        customPortInput.value = '';
        filterJobs();
      }
    }

    function handleCustomPortInput() {
      const customPortInput = document.getElementById('customPortInput');
      const portName = customPortInput.value.trim();
      
      if (portName.length > 0) {
        // Update the port filter to show the custom port name
        const portFilter = document.getElementById('portFilter');
        const customOption = portFilter.querySelector('option[value="custom"]');
        if (customOption) {
          customOption.textContent = `➕ Add Custom Port (${portName})`;
        }
        
        // Filter jobs with the custom port
        filterJobs();
      }
    }

    function clearFilters() {
      document.getElementById('categoryFilter').value = '';
      document.getElementById('positionFilter').value = '';
      document.getElementById('jobTypeFilter').value = '';
      document.getElementById('countryFilter').value = '';
      document.getElementById('cityFilter').value = '';
      document.getElementById('portFilter').value = '';
      document.getElementById('searchFilter').value = '';
      
      // Clear custom port input
      const customPortInput = document.getElementById('customPortInput');
      customPortInput.value = '';
      customPortInput.style.display = 'none';
      
      // Reset disabled states
      document.getElementById('cityFilter').disabled = true;
      document.getElementById('portFilter').disabled = true;
      
      loadJobs();
    }

    function openApplicationModal(jobId) {
      currentJobId = jobId;
      const modal = document.getElementById('applicationModal');
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
      document.getElementById('applicationForm').reset();
      
      // Pre-fill email if available from user data
      const userEmail = localStorage.getItem('userEmail');
      if (userEmail) {
        document.querySelector('#applicationModal input[name="email"]').value = userEmail;
      }
    }

    function closeModal() {
      document.getElementById('applicationModal').style.display = 'none';
      document.body.style.overflow = '';
      currentJobId = null;
    }

    // Expose for inline onclick handlers
    window.openApplicationModal = openApplicationModal;
    window.closeModal = closeModal;
    window.filterJobs = filterJobs;
    window.clearFilters = clearFilters;
    window.loadFilterCities = loadFilterCities;
    window.loadFilterPorts = loadFilterPorts;
    window.handlePortSelection = handlePortSelection;
    window.handleCustomPortInput = handleCustomPortInput;

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('applicationModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    async function ensureProfileComplete() {
      const token = localStorage.getItem('token');
      if (!token || localStorage.getItem('userType') !== 'jobseeker') {
        window.location.href = '/login.html';
        return false;
      }
      const res = await fetch('/api/v1/profile', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        const profile = await res.json();
        if (!profile.profileComplete) {
          window.location.href = '/crew-profile.html';
          return false;
        }
      }
      return true;
    }

    document.addEventListener('DOMContentLoaded', async function() {
      const ok = await ensureProfileComplete();
      if (!ok) return;

      const token = localStorage.getItem('token');

      const applicationForm = document.getElementById('applicationForm');
      const submitBtn = document.getElementById('submitBtn');

      if (applicationForm) {
        applicationForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          if (!currentJobId) {
            alert('No job selected');
            return;
          }

          // Disable submit button
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<div class="spinner"></div> Submitting...';

          const formData = new FormData(this);
          
          // Get form values
          const email = formData.get('email');
          const phone = formData.get('phone');
          const coverLetter = formData.get('coverLetter');
          
          // Validate email format
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            alert('Please enter a valid email address');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Submit Application';
            return;
          }
          
          // Validate phone number (basic validation)
          const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
          if (!phoneRegex.test(phone.replace(/[\s\-\(\)]/g, ''))) {
            alert('Please enter a valid phone number');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Submit Application';
            return;
          }
          
          // Create new FormData with only the values we need
          const cleanFormData = new FormData();
          cleanFormData.append('email', email);
          cleanFormData.append('phone', phone);
          cleanFormData.append('coverLetter', coverLetter);
          
          // Add the resume file
          const resumeFile = formData.get('resume');
          if (resumeFile) {
            cleanFormData.append('resume', resumeFile);
          }

                      try {
              const res = await fetch(`/api/v1/jobs/${currentJobId}/apply`, {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + token
                },
                body: cleanFormData
              });

            if (res.ok) {
              alert('Application submitted successfully!');
              closeModal();
              // Refresh the jobs list
              loadJobs();
            } else {
              const data = await res.json();
              alert(data.message || 'Failed to submit application');
            }
          } catch (error) {
            alert('Error submitting application');
          } finally {
            // Re-enable submit button
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Submit Application';
          }
        });
      }

      // Mobile menu toggle function
      function toggleMobileMenu() {
        const navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('show');
      }

      // Close mobile menu when clicking outside
      document.addEventListener('click', function(event) {
        const navLinks = document.getElementById('navLinks');
        const mobileToggle = document.querySelector('.mobile-menu-toggle');
        
        if (!navLinks.contains(event.target) && !mobileToggle.contains(event.target)) {
          navLinks.classList.remove('show');
        }
      });

      // Load countries and jobs when page loads
      loadFilterCountries();
      loadJobs();
    });
  </script>
  <script src="/nca-layout.js"></script>
</body>
</html>
