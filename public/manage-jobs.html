<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Jobs - Yacht Crew Portal</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
</head>
<body class="nca-app" data-nca-role="employer" data-nca-page="manage-jobs" data-nca-title="Manage Jobs" data-nca-subtitle="Edit, close, or delete your postings">
  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="totalJobs">0</div>
        <div class="stat-label">Total Jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="activeJobs">0</div>
        <div class="stat-label">Active Jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="closedJobs">0</div>
        <div class="stat-label">Closed Jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalApplications">0</div>
        <div class="stat-label">Total Applications</div>
      </div>
    </div>

    <div class="filter-section">
      <h3>Filter Jobs</h3>
      <div class="filter-row">
        <select id="statusFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="closed">Closed</option>
        </select>
        <select id="categoryFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Categories</option>
          <option value="Daywork">Daywork</option>
          <option value="Freelance">Freelance</option>
          <option value="Delivery">Delivery</option>
        </select>
        <select id="positionFilter" class="filter-select" onchange="filterJobs()">
          <option value="">All Positions</option>
          <option value="Captain">Captain</option>
          <option value="Engineer">Engineer</option>
          <option value="Bosun">Bosun</option>
          <option value="Mate">Mate</option>
          <option value="Deckhand">Deckhand</option>
          <option value="Chef/crew cook">Chef/crew cook</option>
          <option value="Chief Stewardess">Chief Stewardess</option>
          <option value="2nd Stewardess">2nd Stewardess</option>
          <option value="Stewardess">Stewardess</option>
        </select>
      </div>
      
      <div class="filter-row">
        <div class="location-selector">
          <select id="countryFilter" class="filter-select" onchange="loadFilterCities()">
            <option value="">All Countries</option>
          </select>
          <select id="cityFilter" class="filter-select" onchange="loadFilterPorts()">
            <option value="">All Cities</option>
          </select>
          <select id="portFilter" class="filter-select" onchange="handlePortSelection()">
            <option value="">All Ports</option>
          </select>
          <input type="text" id="customPortInput" class="form-input" placeholder="Type custom port name..." style="display: none;" onkeyup="handleCustomPortInput()">
        </div>
        <button class="btn btn-outline" onclick="clearFilters()">Clear Filters</button>
      </div>
    </div>

    <div id="jobsList">
      <div class="loading">
        <div class="spinner"></div>
        Loading jobs...
      </div>
    </div>
  </div>

  <!-- Edit Job Modal -->
  <div id="editJobModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Job</h3>
        <span class="modal-close" onclick="closeEditModal()">&times;</span>
      </div>
      <div class="modal-body">
        <form id="editJobForm">
          <div class="form-group">
            <label class="form-label">Job Title</label>
            <input type="text" id="editTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Company</label>
            <input type="text" id="editCompany" class="form-input" required>
          </div>
                     <div class="form-group">
             <label class="form-label">Location *</label>
             <div class="location-selector">
               <select id="editCountry" class="form-select" required onchange="loadEditCities()">
                 <option value="">Select Country</option>
               </select>
               <select id="editCity" class="form-select" required onchange="loadEditPorts()" disabled>
                 <option value="">Select City</option>
               </select>
               <select id="editPort" class="form-select" onchange="handleEditPortSelection()">
                 <option value="">Select Port (Optional)</option>
               </select>
               <input type="text" id="editCustomPort" class="form-input" placeholder="Or type custom port name..." style="display: none;" onkeyup="handleEditCustomPortInput()">
               <input type="text" id="editLocationDisplay" class="form-input" readonly placeholder="Location will be displayed here">
             </div>
           </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Type</label>
              <select id="editJobCategory" class="form-select" required onchange="updateEditPositions()">
                <option value="">Select Category</option>
                <option value="Daywork">Daywork</option>
                <option value="Freelance">Freelance</option>
                <option value="Delivery">Delivery</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Position</label>
              <select id="editPosition" class="form-select" required>
                <option value="">Select Position</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Schedule Type</label>
              <select id="editJobType" class="form-select" required>
                <option value="">Select Type</option>
                <option value="Daywork">Daywork</option>
                <option value="Freelance">Freelance</option>
                <option value="Delivery">Delivery</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Salary</label>
              <input type="text" id="editSalary" class="form-input" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="editDescription" class="form-textarea" rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Requirements (comma separated)</label>
            <input type="text" id="editRequirements" class="form-input" placeholder="e.g., Experience, Certifications, Skills">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select id="editStatus" class="form-select" required>
              <option value="active">Active</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="form-row">
            <button type="submit" class="btn btn-primary">Update Job</button>
            <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let allJobs = [];
    let currentEditJob = null;

    function logout() { ncaLogout(); }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    // Helper function to format location display
    function formatLocation(location) {
      if (!location) return 'Location not specified';
      
      // If location is a string (old format), return as is
      if (typeof location === 'string') {
        return location;
      }
      
      // If location is an object (new format), format it properly
      if (typeof location === 'object') {
        if (location.displayName) {
          return location.displayName;
        }
        
        let locationParts = [];
        if (location.city) locationParts.push(location.city);
        if (location.port) locationParts.push(location.port);
        if (location.country) locationParts.push(location.country);
        
        return locationParts.length > 0 ? locationParts.join(', ') : 'Location not specified';
      }
      
      return 'Location not specified';
    }

    function updateEditPositions() {
      const category = document.getElementById('editJobCategory').value;
      const positionSelect = document.getElementById('editPosition');
      positionSelect.innerHTML = '<option value="">Select Position</option>';
      
      if (category === 'Daywork' || category === 'Freelance' || category === 'Daywork/Freelance') {
        const positions = ['Captain', 'Engineer', 'Bosun', 'Mate', 'Deckhand', 'Chef/crew cook', 'Chief Stewardess', '2nd Stewardess'];
        positions.forEach(pos => {
          positionSelect.innerHTML += `<option value="${pos}">${pos}</option>`;
        });
      } else if (category === 'Delivery' || category === 'Deliveries') {
        const positions = ['Captain', 'Mate', 'Stewardess', 'Chef'];
        positions.forEach(pos => {
          positionSelect.innerHTML += `<option value="${pos}">${pos}</option>`;
        });
      }
    }

    async function loadJobs() {
      const token = localStorage.getItem('token');
      if (!token) {
        console.log('No token found, redirecting to login');
        window.location.href = '/login.html';
        return;
      }

      console.log('Loading jobs with token:', token.substring(0, 20) + '...');

      try {
        const res = await fetch('/api/v1/jobs/posted', {
          headers: { 
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });
        
        console.log('Response status:', res.status);
        console.log('Response headers:', res.headers);
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error('HTTP Error:', res.status, errorText);
          throw new Error(`HTTP ${res.status}: ${errorText}`);
        }
        
        const jobs = await res.json();
        console.log('Jobs loaded:', jobs.length, 'jobs');
        console.log('Jobs data:', jobs);
        
        allJobs = jobs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        updateStats();
        displayJobs(allJobs);
      } catch (error) {
        console.error('Error loading jobs:', error);
        document.getElementById('jobsList').innerHTML = `
          <div class="message message-error">
            <h4>Error loading jobs</h4>
            <p>${error.message}</p>
            <p>Please check your connection and try again.</p>
            <button class="btn btn-outline" onclick="loadJobs()">Retry</button>
          </div>
        `;
      }
    }

    function updateStats() {
      const total = allJobs.length;
      const active = allJobs.filter(job => job.status === 'active').length;
      const closed = allJobs.filter(job => job.status === 'closed').length;
      const totalApplications = allJobs.reduce((sum, job) => sum + (job.applications ? job.applications.length : 0), 0);
      
      document.getElementById('totalJobs').textContent = total;
      document.getElementById('activeJobs').textContent = active;
      document.getElementById('closedJobs').textContent = closed;
      document.getElementById('totalApplications').textContent = totalApplications;
    }

    function displayJobs(jobs) {
      const jobsDiv = document.getElementById('jobsList');
      
      if (jobs.length === 0) {
        jobsDiv.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔗</div>
            <h3>No jobs found</h3>
            <p>Try adjusting your filters or post a new job.</p>
          </div>
        `;
        return;
      }

      jobsDiv.innerHTML = jobs.map(job => `
        <div class="job-card">
          <div class="job-header">
            <div>
              <div class="job-title">${job.title}</div>
              <div class="job-company">${job.company}</div>
              <div class="job-meta">
                <span class="job-tag job-category">${job.jobCategory}</span>
                <span class="job-tag job-position">${job.position}</span>
                <span class="job-tag job-type">${job.jobType}</span>
                <span class="job-tag job-location">${formatLocation(job.location)}</span>
                <span class="job-tag job-salary">${job.salary}</span>
              </div>
              <div class="job-date">Posted: ${formatDate(job.createdAt)}</div>
              <div class="job-requirements">
                <strong>Description:</strong> ${job.description}
                ${job.requirements && job.requirements.length > 0 ? 
                  `<br><strong>Requirements:</strong> ${job.requirements.join(', ')}` : ''}
              </div>
            </div>
            <div>
              <span class="status-badge status-${job.status}">${job.status}</span>
              <div style="margin-top: 8px; font-size: 12px; color: var(--text-light);">
                ${job.applications ? job.applications.length : 0} applications
              </div>
              <div class="job-actions" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
                <button class="btn btn-outline btn-sm" onclick="editJob('${job._id}')" style="width: 100%; min-width: 80px;">
                  Edit
                </button>
                <button class="btn btn-outline btn-sm" onclick="toggleJobStatus('${job._id}', '${job.status}')" style="width: 100%; min-width: 80px;">
                  ${job.status === 'active' ? 'Close' : 'Reopen'}
                </button>
                <button class="btn btn-outline btn-sm" onclick="deleteJob('${job._id}')" style="width: 100%; min-width: 80px; color: #dc3545; border-color: #dc3545;">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterJobs() {
      const statusFilter = document.getElementById('statusFilter').value;
      const categoryFilter = document.getElementById('categoryFilter').value;
      const positionFilter = document.getElementById('positionFilter').value;
      const countryFilter = document.getElementById('countryFilter').value;
      const cityFilter = document.getElementById('cityFilter').value;
      const portFilter = document.getElementById('portFilter').value;
      const customPortInput = document.getElementById('customPortInput');
      
      let filteredJobs = allJobs;
      
      if (statusFilter) {
        filteredJobs = filteredJobs.filter(job => job.status === statusFilter);
      }
      
      if (categoryFilter) {
        filteredJobs = filteredJobs.filter(job => job.jobCategory === categoryFilter);
      }
      
      if (positionFilter) {
        filteredJobs = filteredJobs.filter(job => job.position === positionFilter);
      }
      
      // Location filtering
      if (countryFilter) {
        filteredJobs = filteredJobs.filter(job => {
          // Handle both old string format and new object format
          if (typeof job.location === 'string') {
            return job.location.toLowerCase().includes(countryFilter.toLowerCase());
          } else if (job.location && job.location.country) {
            return job.location.country.toLowerCase().includes(countryFilter.toLowerCase());
          }
          return false;
        });
      }
      
      if (cityFilter) {
        filteredJobs = filteredJobs.filter(job => {
          if (typeof job.location === 'string') {
            return job.location.toLowerCase().includes(cityFilter.toLowerCase());
          } else if (job.location && job.location.city) {
            return job.location.city.toLowerCase().includes(cityFilter.toLowerCase());
          }
          return false;
        });
      }
      
      if (portFilter && portFilter !== 'custom') {
        filteredJobs = filteredJobs.filter(job => {
          if (typeof job.location === 'string') {
            return job.location.toLowerCase().includes(portFilter.toLowerCase());
          } else if (job.location && job.location.port) {
            return job.location.port.toLowerCase().includes(portFilter.toLowerCase());
          }
          return false;
        });
      } else if (portFilter === 'custom' && customPortInput.value.trim()) {
        const customPort = customPortInput.value.trim().toLowerCase();
        filteredJobs = filteredJobs.filter(job => {
          if (typeof job.location === 'string') {
            return job.location.toLowerCase().includes(customPort);
          } else if (job.location && job.location.port) {
            return job.location.port.toLowerCase().includes(customPort);
          }
          return false;
        });
      }
      
      displayJobs(filteredJobs);
    }

    function clearFilters() {
      document.getElementById('statusFilter').value = '';
      document.getElementById('categoryFilter').value = '';
      document.getElementById('positionFilter').value = '';
      document.getElementById('countryFilter').value = '';
      document.getElementById('cityFilter').value = '';
      document.getElementById('portFilter').value = '';
      document.getElementById('customPortInput').value = '';
      document.getElementById('customPortInput').style.display = 'none';
      displayJobs(allJobs);
    }

    // Location filtering functions
    async function loadFilterCountries() {
      try {
        console.log('Loading filter countries...');
        const response = await fetch('/api/v1/locations/countries');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Failed to load countries`);
        }
        
        const countries = await response.json();
        console.log('Filter countries loaded:', countries.length);
        
        const countrySelect = document.getElementById('countryFilter');
        countrySelect.innerHTML = '<option value="">All Countries</option>';
        
        countries.forEach(country => {
          countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
        });
      } catch (error) {
        console.error('Error loading filter countries:', error);
        // Don't show error to user for filter loading, just log it
      }
    }

    async function loadFilterCities() {
      const country = document.getElementById('countryFilter').value;
      const citySelect = document.getElementById('cityFilter');
      const portSelect = document.getElementById('portFilter');
      
      // Reset city and port filters
      citySelect.innerHTML = '<option value="">All Cities</option>';
      portSelect.innerHTML = '<option value="">All Ports</option>';
      document.getElementById('customPortInput').style.display = 'none';
      document.getElementById('customPortInput').value = '';
      
      if (!country) {
        filterJobs();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/cities/${encodeURIComponent(country)}`);
        const cities = await response.json();
        
        cities.forEach(city => {
          citySelect.innerHTML += `<option value="${city}">${city}</option>`;
        });
        
        filterJobs();
      } catch (error) {
        console.error('Error loading cities:', error);
        filterJobs();
      }
    }

    async function loadFilterPorts() {
      const country = document.getElementById('countryFilter').value;
      const city = document.getElementById('cityFilter').value;
      const portSelect = document.getElementById('portFilter');
      
      // Reset port filter
      portSelect.innerHTML = '<option value="">All Ports</option>';
      portSelect.innerHTML += '<option value="custom">➕ Add Custom Port</option>';
      document.getElementById('customPortInput').style.display = 'none';
      document.getElementById('customPortInput').value = '';
      
      if (!country || !city) {
        filterJobs();
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/ports/${encodeURIComponent(country)}/${encodeURIComponent(city)}`);
        const ports = await response.json();
        
        ports.forEach(port => {
          portSelect.innerHTML += `<option value="${port}">${port}</option>`;
        });
        
        filterJobs();
      } catch (error) {
        console.error('Error loading ports:', error);
        filterJobs();
      }
    }

    function handlePortSelection() {
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      if (portFilter.value === 'custom') {
        customPortInput.style.display = 'block';
        customPortInput.focus();
      } else {
        customPortInput.style.display = 'none';
        customPortInput.value = '';
      }
      
      filterJobs();
    }

    function handleCustomPortInput() {
      const portFilter = document.getElementById('portFilter');
      const customPortInput = document.getElementById('customPortInput');
      
      if (portFilter.value === 'custom') {
        // Update the custom option text to show what user is typing
        const customOption = portFilter.querySelector('option[value="custom"]');
        if (customOption) {
          customOption.textContent = customPortInput.value ? `➕ ${customPortInput.value}` : '➕ Add Custom Port';
        }
      }
      
      filterJobs();
    }

    async function editJob(jobId) {
      const job = allJobs.find(j => j._id === jobId);
      if (!job) return;
      
      currentEditJob = job;
      
      // Populate form
      document.getElementById('editTitle').value = job.title;
      document.getElementById('editCompany').value = job.company;
      
      // Handle location - populate dropdowns with current location data
      if (job.location && typeof job.location === 'object') {
        // Set country
        const countrySelect = document.getElementById('editCountry');
        countrySelect.value = job.location.country || '';
        
        // Load cities for the selected country
        if (job.location.country) {
          await loadEditCities();
          
          // Set city
          const citySelect = document.getElementById('editCity');
          citySelect.value = job.location.city || '';
          
          // Load ports for the selected city
          if (job.location.city) {
            await loadEditPorts();
            
            // Set port
            const portSelect = document.getElementById('editPort');
            if (job.location.port) {
              // Check if the port exists in the dropdown
              const portExists = Array.from(portSelect.options).some(option => option.value === job.location.port);
              if (portExists) {
                portSelect.value = job.location.port;
              } else {
                // If port doesn't exist, set to custom and populate custom input
                portSelect.value = 'custom';
                document.getElementById('editCustomPort').value = job.location.port;
                document.getElementById('editCustomPort').style.display = 'block';
              }
            }
          }
        }
      } else if (typeof job.location === 'string') {
        // For old string format, try to parse it
        const locationParts = job.location.split(', ').map(part => part.trim());
        if (locationParts.length >= 2) {
          const countrySelect = document.getElementById('editCountry');
          countrySelect.value = locationParts[locationParts.length - 1] || '';
          
          if (locationParts[locationParts.length - 1]) {
            await loadEditCities();
            const citySelect = document.getElementById('editCity');
            citySelect.value = locationParts[0] || '';
            
            if (locationParts[0]) {
              await loadEditPorts();
              if (locationParts.length > 2) {
                const portSelect = document.getElementById('editPort');
                const portValue = locationParts[1];
                const portExists = Array.from(portSelect.options).some(option => option.value === portValue);
                if (portExists) {
                  portSelect.value = portValue;
                } else {
                  portSelect.value = 'custom';
                  document.getElementById('editCustomPort').value = portValue;
                  document.getElementById('editCustomPort').style.display = 'block';
                }
              }
            }
          }
        }
      }
      
      // Update the location display
      updateEditLocationDisplay();
      
      document.getElementById('editJobCategory').value = job.jobCategory;
      document.getElementById('editJobType').value = job.jobType;
      document.getElementById('editSalary').value = job.salary;
      document.getElementById('editDescription').value = job.description;
      document.getElementById('editRequirements').value = job.requirements ? job.requirements.join(', ') : '';
      document.getElementById('editStatus').value = job.status;
      
      updateEditPositions();
      document.getElementById('editPosition').value = job.position;
      
      document.getElementById('editJobModal').style.display = 'block';
    }

    function closeEditModal() {
      document.getElementById('editJobModal').style.display = 'none';
      currentEditJob = null;
    }

    async function updateJob(event) {
      event.preventDefault();
      
      if (!currentEditJob) return;
      
      const token = localStorage.getItem('token');
      // Handle location data
      const country = document.getElementById('editCountry').value;
      const city = document.getElementById('editCity').value;
      const port = document.getElementById('editPort').value;
      const customPort = document.getElementById('editCustomPort').value.trim();
      const locationDisplay = document.getElementById('editLocationDisplay').value;
      
      let finalPort = '';
      if (port === 'custom' && customPort) {
        finalPort = customPort;
      } else if (port && port !== 'custom') {
        finalPort = port;
      }

      const formData = {
        title: document.getElementById('editTitle').value,
        company: document.getElementById('editCompany').value,
        location: {
          country: country,
          city: city,
          port: finalPort,
          displayName: locationDisplay
        },
        jobCategory: document.getElementById('editJobCategory').value,
        position: document.getElementById('editPosition').value,
        jobType: document.getElementById('editJobType').value,
        salary: document.getElementById('editSalary').value,
        description: document.getElementById('editDescription').value,
        requirements: document.getElementById('editRequirements').value.split(',').map(r => r.trim()).filter(r => r),
        status: document.getElementById('editStatus').value
      };

      try {
        const res = await fetch(`/api/v1/jobs/${currentEditJob._id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(formData)
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        // Reload jobs
        await loadJobs();
        closeEditModal();
        
        // Show success message
        alert('Job updated successfully!');
      } catch (error) {
        console.error('Error updating job:', error);
        alert('Error updating job: ' + error.message);
      }
    }

    async function toggleJobStatus(jobId, currentStatus) {
      const newStatus = currentStatus === 'active' ? 'closed' : 'active';
      const action = currentStatus === 'active' ? 'close' : 'reopen';
      
      if (!confirm(`Are you sure you want to ${action} this job?`)) return;
      
      const token = localStorage.getItem('token');
      
      try {
        const res = await fetch(`/api/v1/jobs/${jobId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ status: newStatus })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        await loadJobs();
        alert(`Job ${action}d successfully!`);
      } catch (error) {
        console.error('Error updating job status:', error);
        alert('Error updating job status: ' + error.message);
      }
    }

    async function deleteJob(jobId) {
      if (!confirm('Are you sure you want to delete this job? This action cannot be undone.')) return;
      
      const token = localStorage.getItem('token');
      
      try {
        const res = await fetch(`/api/v1/jobs/${jobId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        await loadJobs();
        alert('Job deleted successfully!');
      } catch (error) {
        console.error('Error deleting job:', error);
        alert('Error deleting job: ' + error.message);
      }
    }

    // Event listeners
    document.getElementById('editJobForm').addEventListener('submit', updateJob);
    
    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('editJobModal');
      if (event.target === modal) {
        closeEditModal();
      }
    }

    // Edit modal location handling functions
    async function loadEditCountries() {
      try {
        console.log('Loading edit countries...');
        const response = await fetch('/api/v1/locations/countries');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Failed to load countries`);
        }
        
        const countries = await response.json();
        console.log('Edit countries loaded:', countries.length);
        
        const countrySelect = document.getElementById('editCountry');
        countrySelect.innerHTML = '<option value="">Select Country</option>';
        
        countries.forEach(country => {
          const option = document.createElement('option');
          option.value = country;
          option.textContent = country;
          countrySelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading edit countries:', error);
        // Show error in modal
        const countrySelect = document.getElementById('editCountry');
        countrySelect.innerHTML = '<option value="">Error loading countries</option>';
      }
    }

    async function loadEditCities() {
      const countrySelect = document.getElementById('editCountry');
      const citySelect = document.getElementById('editCity');
      const portSelect = document.getElementById('editPort');
      
      const country = countrySelect.value;
      
      // Reset city and port
      citySelect.innerHTML = '<option value="">Select City</option>';
      portSelect.innerHTML = '<option value="">Select Port (Optional)</option>';
      
      if (!country) {
        citySelect.disabled = true;
        portSelect.disabled = true;
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/cities/${encodeURIComponent(country)}`);
        const cities = await response.json();
        
        citySelect.disabled = false;
        
        cities.forEach(city => {
          const option = document.createElement('option');
          option.value = city;
          option.textContent = city;
          citySelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading cities:', error);
      }
    }

    async function loadEditPorts() {
      const countrySelect = document.getElementById('editCountry');
      const citySelect = document.getElementById('editCity');
      const portSelect = document.getElementById('editPort');
      const customPortInput = document.getElementById('editCustomPort');
      
      const country = countrySelect.value;
      const city = citySelect.value;
      
      // Reset port and custom input
      portSelect.innerHTML = '<option value="">Select Port (Optional)</option>';
      customPortInput.style.display = 'none';
      customPortInput.value = '';
      
      if (!country || !city) {
        portSelect.disabled = true;
        customPortInput.style.display = 'none';
        return;
      }
      
      try {
        const response = await fetch(`/api/v1/locations/ports/${encodeURIComponent(country)}/${encodeURIComponent(city)}`);
        const ports = await response.json();
        
        portSelect.disabled = false;
        
        if (ports.length > 0) {
          ports.forEach(port => {
            const option = document.createElement('option');
            option.value = port;
            option.textContent = port;
            portSelect.appendChild(option);
          });
        }
        
        // Add "Add Custom Port" option
        const customOption = document.createElement('option');
        customOption.value = 'custom';
        customOption.textContent = '➕ Add Custom Port';
        portSelect.appendChild(customOption);
      } catch (error) {
        console.error('Error loading ports:', error);
      }
      
      updateEditLocationDisplay();
    }

    function handleEditPortSelection() {
      const portSelect = document.getElementById('editPort');
      const customPortInput = document.getElementById('editCustomPort');
      
      if (portSelect.value === 'custom') {
        // Show custom port input
        customPortInput.style.display = 'block';
        customPortInput.focus();
        customPortInput.value = '';
      } else {
        // Hide custom port input and update display
        customPortInput.style.display = 'none';
        customPortInput.value = '';
        updateEditLocationDisplay();
      }
    }

    function handleEditCustomPortInput() {
      const customPortInput = document.getElementById('editCustomPort');
      const portName = customPortInput.value.trim();
      
      if (portName.length > 0) {
        // Update the port select to show the custom port name
        const portSelect = document.getElementById('editPort');
        const customOption = portSelect.querySelector('option[value="custom"]');
        if (customOption) {
          customOption.textContent = `➕ Add Custom Port (${portName})`;
        }
        
        // Update location display
        updateEditLocationDisplay();
      }
    }

    function updateEditLocationDisplay() {
      const countrySelect = document.getElementById('editCountry');
      const citySelect = document.getElementById('editCity');
      const portSelect = document.getElementById('editPort');
      const customPortInput = document.getElementById('editCustomPort');
      const displayInput = document.getElementById('editLocationDisplay');
      
      const country = countrySelect.value;
      const city = citySelect.value;
      const port = portSelect.value;
      const customPort = customPortInput.value.trim();
      
      let displayText = '';
      if (city && country) {
        displayText = city;
        
        // Handle custom port input
        if (port === 'custom' && customPort) {
          displayText += `, ${customPort}`;
        } else if (port && port !== 'custom') {
          displayText += `, ${port}`;
        }
        
        displayText += `, ${country}`;
      }
      
      displayInput.value = displayText;
    }

    // Mobile menu toggle function
    function toggleMobileMenu() {
      const navLinks = document.getElementById('navLinks');
      navLinks.classList.toggle('show');
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
      const navLinks = document.getElementById('navLinks');
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      
      if (!navLinks.contains(event.target) && !mobileToggle.contains(event.target)) {
        navLinks.classList.remove('show');
      }
    });

    // Load jobs and countries when page loads
    document.addEventListener('DOMContentLoaded', async function() {
      console.log('Page loaded, initializing...');
      
      try {
        // Show loading state
        document.getElementById('jobsList').innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            Loading jobs...
          </div>
        `;
        
        // Load data in parallel
        await Promise.all([
          loadJobs(),
          loadFilterCountries(),
          loadEditCountries()
        ]);
        
        console.log('Page initialization complete');
      } catch (error) {
        console.error('Error during page initialization:', error);
        document.getElementById('jobsList').innerHTML = `
          <div class="message message-error">
            <h4>Error initializing page</h4>
            <p>${error.message}</p>
            <button class="btn btn-outline" onclick="location.reload()">Reload Page</button>
          </div>
        `;
      }
      
      // Add event listeners for edit modal location dropdowns
      const editCountry = document.getElementById('editCountry');
      const editCity = document.getElementById('editCity');
      const editPort = document.getElementById('editPort');
      const editCustomPort = document.getElementById('editCustomPort');
      
      if (editCountry) editCountry.addEventListener('change', updateEditLocationDisplay);
      if (editCity) editCity.addEventListener('change', updateEditLocationDisplay);
      if (editPort) editPort.addEventListener('change', updateEditLocationDisplay);
      if (editCustomPort) editCustomPort.addEventListener('input', updateEditLocationDisplay);
    });
  </script>
  <script src="/nca-layout.js"></script>
</body>
</html>
