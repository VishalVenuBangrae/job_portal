<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    .container { max-width: 400px; margin: auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
    h1 { text-align: center; }
    form { margin-top: 2em; }
    label { display: block; margin-top: 1em; }
    input { width: 100%; padding: 0.5em; margin-top: 0.2em; }
    button { margin-top: 1em; padding: 0.7em 2em; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .error { color: red; margin-top: 1em; }
    .success { color: green; margin-top: 1em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Password</h1>
    <form id="resetForm">
      <label>Email: <input type="email" name="email" required></label>
      <label>Reset Code: <input type="text" name="code" required></label>
      <label>New Password: <input type="password" name="newPassword" required></label>
      <button type="submit">Reset Password</button>
      <div class="error" id="resetError"></div>
      <div class="success" id="resetSuccess"></div>
    </form>
    <p style="text-align:center;">Back to <a href="/login.html">Login</a></p>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const emailInput = document.querySelector('input[name="email"]');
      const storedEmail = localStorage.getItem('resetEmail');
      if (storedEmail) {
        emailInput.value = storedEmail;
        emailInput.readOnly = true;
      }
    });
  </script>
  <script src="/reset-password.js"></script>
</body>
</html>
