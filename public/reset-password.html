<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Nauti Crew Agency</title>
  <link rel="stylesheet" href="/nca-dashboard.css">
  <style>
    #resetError:not(:empty), #resetSuccess:not(:empty) { margin-top: 12px; font-size: 0.85rem; }
    #resetError:not(:empty) { color: var(--danger); }
    #resetSuccess:not(:empty) { color: var(--success); }
  </style>
</head>
<body class="nca-auth">
  <div class="nca-auth-card">
    <div class="nca-auth-logo">
      <img src="/images/nca-logo.png" alt="Nauti Crew Agency">
      <div class="eyebrow">Nauti Crew Agency</div>
    </div>
    <h1 class="nca-auth-title">Reset Password</h1>
    <p class="nca-auth-subtitle">Enter your email, reset code, and new password</p>

    <form id="resetForm">
      <div class="form-group">
        <input type="email" class="form-input" name="email" placeholder="Email address" required>
        <span class="input-icon">@</span>
      </div>
      <div class="form-group">
        <input type="text" class="form-input" name="code" placeholder="Reset code" required>
        <span class="input-icon">#</span>
      </div>
      <div class="form-group">
        <input type="password" class="form-input" name="newPassword" placeholder="New password" required>
        <span class="input-icon">*</span>
      </div>
      <button type="submit" class="nca-auth-btn">Reset Password</button>
      <div id="resetError"></div>
      <div id="resetSuccess"></div>
    </form>

    <div class="nca-auth-links">
      <p>Back to <a href="/login.html">Login</a></p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const emailInput = document.querySelector('input[name="email"]');
      const storedEmail = localStorage.getItem('resetEmail');
      if (storedEmail) {
        emailInput.value = storedEmail;
        emailInput.readOnly = true;
      }
    });
  </script>
  <script src="/reset-password.js"></script>
</body>
</html>
